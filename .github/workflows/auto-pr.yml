name: Auto PR on MLOPS commit

on:
  push:
    branches:
      - dev

jobs:
  check-and-create-pr:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'MLOPS')
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create Pull Request if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing_pr" ]; then
            echo "Ya existe un PR abierto (#$existing_pr). No se crea uno nuevo."
          else
            gh pr create \
              --base main \
              --head dev \
              --title "Promote dev -> main" \
              --body "PR automático generado por GitHub Actions.

          Condición: presencia de la palabra exacta \`MLOPS\` en un mensaje de commit." \
              --label auto-pr,release
          fi
