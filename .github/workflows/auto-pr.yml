name: Auto PR on MLOPS commit

on:
  push:
    branches:
      - dev

jobs:
  check-and-create-pr:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'MLOPS')
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head dev \
            --title "Promote dev -> main (1 commit)" \
            --body "PR automático generado por GitHub Actions.

          - Base: \`main\`
          - Head: \`dev\`
          - Commits por delante: 1

          Condición: presencia de la palabra exacta \`MLOPS\` en un mensaje de commit." \
            --label auto-pr,release
